[package]
name = "openpulse-ardop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openpulse-tnc"
path = "src/main.rs"

[package.metadata.deb]
name = "openpulse-tnc"
maintainer = "OpenPulse Contributors"
copyright = "2025 OpenPulse Contributors"
license-file = ["../../LICENSE", "4"]
extended-description = "OpenPulseHF ARDOP-compatible TNC for Winlink and pat interoperability"
depends = "$auto"
section = "hamradio"
priority = "optional"

[features]
# Enable real CPAL audio hardware support in the TNC binary.
cpal = ["openpulse-audio/cpal-backend"]
# #1258: the serial (rts/dtr) and GPIO PTT backends. Without these forwards the shared builder
# compiles their "not compiled in" arms, so `ptt_backend = "rts"` would refuse on a `-p` build of
# this binary even though `[modem]` documents it as shared with the daemon. Forwarding is necessary
# and not sufficient — no shipped build recipe names these features yet, for any binary.
serial = ["openpulse-radio/serial"]
generic-serial = ["openpulse-radio/generic-serial"]
gpio = ["openpulse-radio/gpio"]

[dependencies]
openpulse-core.workspace = true
openpulse-audio.workspace = true
openpulse-modem.workspace = true
openpulse-radio.workspace = true
openpulse-config.workspace = true
openpulse-qsy.workspace = true
bpsk-plugin.workspace = true
fsk4-plugin.workspace = true
ofdm-plugin.workspace = true
psk8-plugin.workspace = true
qam64-plugin.workspace = true
qpsk-plugin.workspace = true
pilot-plugin.workspace = true
scfdma-plugin.workspace = true
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true

[dev-dependencies]
tokio.workspace = true
