# Fast, always-on traceability gates. These run on EVERY pull request and need no compile
# (Python + grep over the tree), so they hold even while the full workspace gate in ci.yml is
# `disabled_manually` — the hole that let #1074 and the rotted matrix through. They enforce the
# STRUCTURAL half of the trace contract; the run-status half (CITED-BUT-DIDN'T-RUN) needs a real
# test run and is verified by scripts/gate.sh inside ci.yml / locally.
#
# Actions pinned to a full commit SHA with the tag as a trailing comment (see ci.yml for why).
name: Traceability

on:
  pull_request:
    # `edited` is NOT in the default set (opened, synchronize, reopened) and is required here, because
    # the trailer lint reads the PR BODY and TITLE. Without it the check's own instruction — "Add a
    # line to the PR description" — produces no new run, so a PR failing for a missing trailer cannot
    # be fixed by adding one (#1136). `gh run rerun` does not help: it replays the original event
    # payload, so it re-lints the STALE body and fails identically. The only other way out is pushing
    # a commit purely to make CI re-read a text field.
    #
    # `edited` also fires on title changes, which is correct rather than incidental: the title is the
    # other half of the squash message this job assembles.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: trace-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Traceability gates (trace + reachability + trailer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history: the trailer lint walks base..HEAD and grandfathers by commit date.
          fetch-depth: 0

      - name: Install pyyaml
        run: python3 -m pip install --user pyyaml

      # R1: requirements-as-data — every ratified/enforced requirement has a live capability and a
      # binding; no dangling code/tests; no NEW code orphan; REQ<->CAP agree. Run-status of enforced
      # bindings is confirmed by the full gate (needs a test run); this is the structural check.
      - name: Trace check (requirements substrate)
        run: ./scripts/trace.sh check

      # R2: reachability ratchet — a NEW public item no production code references. Grandfathered
      # baseline; only growth fails.
      - name: Reachability ratchet
        run: ./scripts/reachability.sh check

      # R4: requirements-trailer lint — production commits must carry Implements:/Refactors:/
      # Verification-objective:, IDs validated against requirements.yaml. Bright-line grandfathers
      # history.
      #
      # BASE IS THE PR'S BASE BRANCH, NOT `base.sha` (#1219). Two values in the SAME event payload
      # are refreshed on different schedules: `github.sha` — the test merge this job checks out —
      # is minted per event and is fresh even on `edited`, while `pull_request.base.sha` was
      # observed to refresh only on `synchronize`. When the merge is fresher, the range spans
      # commits merged to the base by OTHER PRs, and an untouched PR is linted against work its
      # author never wrote. Neither schedule is documented, so the fix is to stop reading payload
      # freshness at all: `origin/<base.ref>` is resolved from this job's own fetch
      # (`+refs/heads/*:refs/remotes/origin/*` under `fetch-depth: 0`, so every head is present, and
      # an open PR's base branch cannot be deleted) and is therefore consistent with HEAD by
      # construction. The ref name goes through `env:` for the same reason the title and body do —
      # a git refname may legally contain `$`, `;`, `(`, `)`.
      #
      # If that fetch is ever narrowed to a shallow depth, `origin/<base.ref>` disappears; both
      # scripts now exit 2 on an unresolvable base rather than silently reporting an empty range.
      - name: Requirements-trailer lint (branch commits)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ./scripts/check-trailer.sh "origin/$BASE_REF"

      # THE SQUASH BLIND SPOT. This repo squash-merges, so the commits linted above are DISCARDED
      # and what lands on main is the squash message — composed from the PR title + body. Without
      # this step the permanent record is unguarded; it has only worked so far because the default
      # squash body concatenates the branch commits, which an edited message silently drops.
      # The body reaches the script through env and a file, never inlined into the shell: a PR body
      # is untrusted input, and `${{ }}` interpolation into a `run:` block is a script-injection
      # vector (an attacker-authored body containing $( ) would execute with this job's token).
      - name: Requirements-trailer lint (PR body = the squash message)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr-message.txt"
          ./scripts/check-trailer.sh --message-file "$RUNNER_TEMP/pr-message.txt"

      # Same host, same reason, same injection discipline (body via env and a file, never inlined).
      # This one asks whether the change was adversarially reviewed. Tier 1 is one line on every PR;
      # tier 2 demands a real artifact when the diff touches a decision site, and is classified from
      # the PR's own diff — hence the base ref (see #1219 above for why a ref and not `base.sha`).
      # An unresolvable base used to classify as "ordinary change" and PASS, i.e. the check failed
      # OPEN; it now exits 2.
      #
      # It lives HERE and not in gate.sh because the workspace gate does not run at merge (#1144):
      # every ci.yml job is release/**-scoped, so a gate-only check would fire weeks after the lapse.
      - name: Adversarial-review trailer lint (PR body)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr-review-message.txt"
          ./scripts/check-review.sh --message-file "$RUNNER_TEMP/pr-review-message.txt" \
                                    --base "origin/$BASE_REF"

      # Re-homed doc / attribute lint (#1345): a diff that moves a `///` doc or an outer `#[...]` onto
      # the wrong item. Same base discipline as the trailer lint above: the ref through `env:`, and
      # the script exits 2 on an unresolvable base rather than reporting an empty, clean range.
      - name: Re-homed docs lint (branch diff)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ./scripts/check-rehomed-docs.sh --base "origin/$BASE_REF"

      # R5's doc constitution (status: living legality + recursive frontmatter) is NOT enforced in CI
      # right now: it lives in docs.yml, which calls the same scripts/validate-doc-frontmatter.sh but
      # is `disabled_manually` (#1129). Run it by hand until that is resolved.
